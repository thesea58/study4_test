<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEIC Self Practice</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #22c55e;
            --error: #ef4444;
            --sidebar-width: 320px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--surface-color);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .file-upload {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .file-upload input {
            font-size: 14px;
        }

        .q-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .q-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .part-section {
            margin-bottom: 20px;
        }
        
        .part-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        .q-btn {
            background: var(--surface-color);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 0;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-main);
            transition: all 0.2s;
        }

        .q-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .q-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        
        .q-btn.correct {
            background-color: #dcfce7;
            border-color: var(--success);
            color: #166534;
        }
        
        .q-btn.wrong {
            background-color: #fee2e2;
            border-color: var(--error);
            color: #991b1b;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
            padding: 40px;
        }

        .question-card {
            background: var(--surface-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .part-badge {
            display: inline-block;
            padding: 6px 12px;
            background-color: #e0f2fe;
            color: #0369a1;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .question-header {
            margin-bottom: 24px;
            font-size: 24px;
            font-weight: 700;
        }

        .context {
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.6;
        }

        .context img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }

        .context audio {
            width: 100%;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .choice-label {
            display: flex;
            align-items: center;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 16px;
            background-color: #f8fafc;
        }

        .choice-label:hover {
            border-color: var(--primary);
            background-color: #eff6ff;
        }

        .choice-label input {
            margin-right: 12px;
            transform: scale(1.2);
        }

        .choice-label.correct {
            background-color: #dcfce7;
            border-color: var(--success);
            color: #166534;
        }

        .choice-label.wrong {
            background-color: #fee2e2;
            border-color: var(--error);
            color: #991b1b;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }
        
        .nav-btns {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        .explanation {
            margin-top: 30px;
            padding: 20px;
            background-color: #fffbeb;
            border-left: 4px solid #f59e0b;
            border-radius: 0 8px 8px 0;
            display: none;
        }

        .explanation h3 {
            color: #b45309;
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        /* Utils */
        .collapse-toggle {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }
        .collapse-toggle:hover {
            text-decoration: underline;
        }
        .collapse-content {
            margin-top: 10px;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 8px;
            display: none;
        }

    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2>TOEIC Practice</h2>
            <div class="file-upload">
                <label for="testSelector" style="font-size: 14px; font-weight: 500;">Chọn đề thi:</label>
                <select id="testSelector" style="padding: 8px; border-radius: 6px; border: 1px solid var(--border); font-size: 14px; background: white; margin-top: 5px;">
                    <option value="" disabled selected>-- Chọn đề thi --</option>
                    <option value="data/study4_toeic_test4_results.json">TOEIC Test 4</option>
                    <option value="data/study4_toeic_test5_results.json">TOEIC Test 5</option>
                    <option value="data/study4_toeic_test6_results.json">TOEIC Test 6</option>
                </select>
            </div>
        </div>
        <div class="q-list-container">
            <div id="qGrid">
                <!-- Question buttons will be generated here -->
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="question-card" id="questionCard" style="display: none;">
            <div class="part-badge" id="qPart">Part 1</div>
            <h2 class="question-header">Question <span id="qNumber"></span></h2>
            
            <div class="context" id="qContext">
                <!-- Context (audio, image, transcript) -->
            </div>

            <div class="choices" id="qChoices">
                <!-- Choices & Questions rendering zone -->
            </div>

            <div class="actions">
                <button class="btn btn-primary" id="checkBtn" onclick="checkAnswer()">Check Answer</button>
                <div class="nav-btns">
                    <button class="btn btn-secondary" onclick="prevQuestion()">Previous</button>
                    <button class="btn btn-secondary" onclick="nextQuestion()">Next</button>
                </div>
            </div>
        </div>
        
        <div id="welcomeMessage" style="text-align: center; margin-top: 100px; color: var(--text-muted);">
            <h2>Vui lòng chọn đề thi ở menu bên trái để bắt đầu</h2>
        </div>
    </div>

    <script>
        let questions = [];
        let questionGroups = [];
        let currentGroupIndex = 0;
        let userAnswers = {};

        function getPartFromNumber(numStr) {
            const num = parseInt(numStr, 10);
            if (isNaN(num)) return "Unknown Part";
            if (num >= 1 && num <= 6) return "Part 1";
            if (num >= 7 && num <= 31) return "Part 2";
            if (num >= 32 && num <= 70) return "Part 3";
            if (num >= 71 && num <= 100) return "Part 4";
            if (num >= 101 && num <= 130) return "Part 5";
            if (num >= 131 && num <= 146) return "Part 6";
            if (num >= 147 && num <= 200) return "Part 7";
            return "Unknown Part";
        }

        document.getElementById('testSelector').addEventListener('change', async function(e) {
            const jsonUrl = e.target.value;
            if (!jsonUrl) return;

            try {
                document.getElementById('welcomeMessage').style.display = 'block';
                document.getElementById('welcomeMessage').innerHTML = '<h2>Đang tải đề thi...</h2>';
                document.getElementById('questionCard').style.display = 'none';
                
                const response = await fetch(jsonUrl);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const parsedQuestions = await response.json();
                
                const seenNumbers = new Set();
                questions = [];
                parsedQuestions.forEach(q => {
                    if (!seenNumbers.has(q.number)) {
                        seenNumbers.add(q.number);
                        questions.push(q);
                    }
                });

                questions.sort((a, b) => parseInt(a.number) - parseInt(b.number));
                
                questionGroups = [];
                let currentGroup = null;
                let lastCleanContext = null;
                
                const cleanHtml = (html) => {
                    if (!html) return "";
                    return html.replace(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi, '');
                };

                questions.forEach(q => {
                    const cleanCtx = cleanHtml(q.context);
                    if (!currentGroup || cleanCtx !== lastCleanContext) {
                        currentGroup = {
                            context: q.context,
                            part: getPartFromNumber(q.number),
                            questions: []
                        };
                        questionGroups.push(currentGroup);
                        lastCleanContext = cleanCtx;
                    }
                    q.part = currentGroup.part;
                    currentGroup.questions.push(q);
                });

                userAnswers = {};
                initApp();
            } catch (error) {
                alert("Lỗi khi tải bài test: " + error.message);
                document.getElementById('welcomeMessage').innerHTML = '<h2>Lỗi tải file. Vui lòng thử lại!</h2>';
            }
        });

        function initApp() {
            document.getElementById('welcomeMessage').style.display = 'none';
            document.getElementById('questionCard').style.display = 'block';
            
            const container = document.getElementById('qGrid');
            container.innerHTML = '';
            
            let currentPart = null;
            let currentGrid = null;

            questionGroups.forEach((group, gIndex) => {
                group.questions.forEach((q) => {
                    let partName = q.part;
                    if (partName !== currentPart) {
                        currentPart = partName;
                        const section = document.createElement('div');
                        section.className = 'part-section';
                        const title = document.createElement('div');
                        title.className = 'part-title';
                        title.innerText = partName;
                        section.appendChild(title);
                        currentGrid = document.createElement('div');
                        currentGrid.className = 'q-grid';
                        section.appendChild(currentGrid);
                        container.appendChild(section);
                    }
                    const btn = document.createElement('button');
                    btn.className = 'q-btn';
                    btn.id = `nav-btn-${q.number}`;
                    btn.innerText = q.number;
                    btn.onclick = () => goToGroup(gIndex);
                    currentGrid.appendChild(btn);
                });
            });

            goToGroup(0);
        }

        function getCorrectAnswer(q) {
            if (q.correctAnswer) return q.correctAnswer;
            const checkedChoice = q.choices.find(c => c.checked);
            if (q.status === 'correct' && checkedChoice) {
                return checkedChoice.value;
            }
            return null;
        }

        function goToGroup(gIndex) {
            if (gIndex < 0 || gIndex >= questionGroups.length) return;
            currentGroupIndex = gIndex;
            const group = questionGroups[gIndex];
            
            document.querySelectorAll('.q-btn.active').forEach(b => b.classList.remove('active'));
            group.questions.forEach(q => {
                const btn = document.getElementById(`nav-btn-${q.number}`);
                if (btn) btn.classList.add('active');
            });

            document.getElementById('qPart').innerText = group.part;
            const qNumbers = group.questions.map(q => q.number).join(' - ');
            document.getElementById('qNumber').innerText = qNumbers;

            let contextHtml = group.context || '';
            const parser = new DOMParser();
            const doc = parser.parseFromString(contextHtml, 'text/html');
            
            doc.querySelectorAll('img').forEach(img => {
                if (img.dataset.src) img.src = img.dataset.src;
                else if (img.getAttribute('src') && img.getAttribute('src').startsWith('/')) {
                    img.src = 'https://study4.com' + img.getAttribute('src');
                }
            });
            doc.querySelectorAll('source').forEach(src => {
                if (src.getAttribute('src') && src.getAttribute('src').startsWith('/')) {
                    src.src = 'https://study4.com' + src.getAttribute('src');
                }
            });
            
            doc.querySelectorAll('.collapse-toggle, [data-toggle="collapse"]').forEach(el => {
                el.className = "collapse-toggle";
            });
            doc.querySelectorAll('.collapse-content, .collapse').forEach(el => {
                el.className = "collapse-content";
            });

            document.getElementById('qContext').innerHTML = doc.body.innerHTML;

            document.getElementById('qContext').querySelectorAll('.collapse-toggle').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    let targetId = el.getAttribute('href');
                    if (targetId && targetId.startsWith('#')) {
                        let target = document.getElementById(targetId.substring(1));
                        if (target) {
                            target.style.display = target.style.display === 'block' ? 'none' : 'block';
                        }
                    }
                });
            });

            document.getElementById('qContext').querySelectorAll('audio').forEach(audio => audio.load());

            const questionsContainer = document.getElementById('qChoices');
            questionsContainer.innerHTML = '';
            
            group.questions.forEach(q => {
                const qDiv = document.createElement('div');
                qDiv.className = 'question-block';
                qDiv.style.marginBottom = '30px';
                qDiv.style.padding = '20px';
                qDiv.style.backgroundColor = '#f8fafc';
                qDiv.style.borderRadius = '8px';
                qDiv.style.border = '1px solid var(--border)';
                
                if (q.questionText) {
                    const qText = document.createElement('div');
                    qText.className = 'question-text';
                    qText.style.fontWeight = '600';
                    qText.style.marginBottom = '15px';
                    qText.innerHTML = `<span style="color:var(--primary)">Câu ${q.number}:</span> ${q.questionText}`;
                    qDiv.appendChild(qText);
                } else {
                    const qText = document.createElement('div');
                    qText.className = 'question-text';
                    qText.style.fontWeight = '600';
                    qText.style.marginBottom = '15px';
                    qText.innerHTML = `<span style="color:var(--primary)">Câu ${q.number}</span>`;
                    qDiv.appendChild(qText);
                }

                const hasCheckedBefore = userAnswers[q.number] !== undefined;
                
                const cDiv = document.createElement('div');
                cDiv.className = 'choices';
                cDiv.id = `choices-container-${q.number}`;
                
                q.choices.forEach(c => {
                    const label = document.createElement('label');
                    label.className = 'choice-label';
                    label.style.backgroundColor = '#ffffff';
                    label.id = `choice-lbl-${q.number}-${c.value}`;
                    
                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `q-${q.qid}`;
                    input.value = c.value;
                    
                    if (hasCheckedBefore && userAnswers[q.number].selected === c.value) {
                        input.checked = true;
                    }
                    if (hasCheckedBefore) input.disabled = true;

                    label.appendChild(input);
                    label.appendChild(document.createTextNode(c.label || c.value));
                    cDiv.appendChild(label);
                });
                
                qDiv.appendChild(cDiv);
                
                const expDiv = document.createElement('div');
                expDiv.className = 'explanation';
                expDiv.id = `exp-${q.number}`;
                expDiv.style.marginTop = '20px';
                expDiv.innerHTML = `<h3>Giải thích câu ${q.number}</h3><div>${q.explanation || 'Không có giải thích.'}</div>`;
                if (hasCheckedBefore) {
                    expDiv.style.display = 'block';
                } else {
                    expDiv.style.display = 'none';
                }
                
                qDiv.appendChild(expDiv);
                questionsContainer.appendChild(qDiv);
                
                if (hasCheckedBefore) {
                    showFeedbackForQuestion(q);
                }
            });

            const allAnswered = group.questions.every(q => userAnswers[q.number] !== undefined);
            document.getElementById('checkBtn').disabled = allAnswered;
        }

        function checkAnswer() {
            const group = questionGroups[currentGroupIndex];
            
            for (let q of group.questions) {
                const selected = document.querySelector(`input[name="q-${q.qid}"]:checked`);
                if (!selected) {
                    alert(`Vui lòng chọn đáp án cho câu ${q.number}!`);
                    return;
                }
            }

            for (let q of group.questions) {
                const selected = document.querySelector(`input[name="q-${q.qid}"]:checked`).value;
                const correctValue = getCorrectAnswer(q);
                userAnswers[q.number] = {
                    selected: selected,
                    isCorrect: (selected === correctValue),
                    correct: correctValue
                };
                showFeedbackForQuestion(q);
                document.getElementById(`exp-${q.number}`).style.display = 'block';
            }
            
            document.getElementById('checkBtn').disabled = true;
        }

        function showFeedbackForQuestion(q) {
            const answerData = userAnswers[q.number];
            if (!answerData) return;

            const navBtn = document.getElementById(`nav-btn-${q.number}`);
            if (navBtn) {
                navBtn.classList.remove('correct', 'wrong');
                navBtn.classList.add(answerData.isCorrect ? 'correct' : 'wrong');
            }

            const cDiv = document.getElementById(`choices-container-${q.number}`);
            if (!cDiv) return;
            const labels = cDiv.querySelectorAll('.choice-label');
            labels.forEach(label => {
                label.classList.remove('correct', 'wrong');
                const input = label.querySelector('input');
                input.disabled = true;
                if (input.value === answerData.correct) {
                    label.classList.add('correct');
                } else if (input.value === answerData.selected && !answerData.isCorrect) {
                    label.classList.add('wrong');
                }
            });
        }

        function nextQuestion() {
            goToGroup(currentGroupIndex + 1);
        }

        function prevQuestion() {
            goToGroup(currentGroupIndex - 1);
        }
    </script>
</body>
</html>
