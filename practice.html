<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEIC Self Practice</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #22c55e;
            --error: #ef4444;
            --sidebar-width: 320px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--surface-color);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .file-upload {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .file-upload input {
            font-size: 14px;
        }

        .q-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .q-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .q-btn {
            background: var(--surface-color);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 0;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-main);
            transition: all 0.2s;
        }

        .q-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .q-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        
        .q-btn.correct {
            background-color: #dcfce7;
            border-color: var(--success);
            color: #166534;
        }
        
        .q-btn.wrong {
            background-color: #fee2e2;
            border-color: var(--error);
            color: #991b1b;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
            padding: 40px;
        }

        .question-card {
            background: var(--surface-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .part-badge {
            display: inline-block;
            padding: 6px 12px;
            background-color: #e0f2fe;
            color: #0369a1;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .question-header {
            margin-bottom: 24px;
            font-size: 24px;
            font-weight: 700;
        }

        .context {
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.6;
        }

        .context img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }

        .context audio {
            width: 100%;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .choice-label {
            display: flex;
            align-items: center;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 16px;
            background-color: #f8fafc;
        }

        .choice-label:hover {
            border-color: var(--primary);
            background-color: #eff6ff;
        }

        .choice-label input {
            margin-right: 12px;
            transform: scale(1.2);
        }

        .choice-label.correct {
            background-color: #dcfce7;
            border-color: var(--success);
            color: #166534;
        }

        .choice-label.wrong {
            background-color: #fee2e2;
            border-color: var(--error);
            color: #991b1b;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }
        
        .nav-btns {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        .explanation {
            margin-top: 30px;
            padding: 20px;
            background-color: #fffbeb;
            border-left: 4px solid #f59e0b;
            border-radius: 0 8px 8px 0;
            display: none;
        }

        .explanation h3 {
            color: #b45309;
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        /* Utils */
        .collapse-toggle {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }
        .collapse-toggle:hover {
            text-decoration: underline;
        }
        .collapse-content {
            margin-top: 10px;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 8px;
            display: none;
        }

    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2>TOEIC Practice</h2>
            <div class="file-upload">
                <label for="fileInput" style="font-size: 14px; font-weight: 500;">Chọn file JSON bài tập:</label>
                <input type="file" id="fileInput" accept=".json">
            </div>
        </div>
        <div class="q-list-container">
            <div class="q-grid" id="qGrid">
                <!-- Question buttons will be generated here -->
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="question-card" id="questionCard" style="display: none;">
            <div class="part-badge" id="qPart">Part 1</div>
            <h2 class="question-header">Question <span id="qNumber"></span></h2>
            
            <div class="context" id="qContext">
                <!-- Context (audio, image, transcript) -->
            </div>

            <div class="choices" id="qChoices">
                <!-- Choices -->
            </div>

            <div class="actions">
                <button class="btn btn-primary" id="checkBtn" onclick="checkAnswer()">Check Answer</button>
                <div class="nav-btns">
                    <button class="btn btn-secondary" onclick="prevQuestion()">Previous</button>
                    <button class="btn btn-secondary" onclick="nextQuestion()">Next</button>
                </div>
            </div>

            <div class="explanation" id="qExplanation">
                <h3>Explanation</h3>
                <div id="explanationContent"></div>
            </div>
        </div>
        
        <div id="welcomeMessage" style="text-align: center; margin-top: 100px; color: var(--text-muted);">
            <h2>Vui lòng chọn file JSON để bắt đầu</h2>
            <p style="margin-top: 10px;">Bạn có thể chọn file study4_toeic_test5_results.json</p>
        </div>
    </div>

    <script>
        let questions = [];
        let currentIndex = 0;
        let userAnswers = {}; // To store user's choices and status

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    questions = JSON.parse(e.target.result);
                    // Sort questions by number just in case
                    questions.sort((a, b) => parseInt(a.number) - parseInt(b.number));
                    userAnswers = {};
                    initApp();
                } catch (error) {
                    alert("Lỗi khi đọc file JSON: " + error.message);
                }
            };
            reader.readAsText(file);
        });

        function initApp() {
            document.getElementById('welcomeMessage').style.display = 'none';
            document.getElementById('questionCard').style.display = 'block';
            
            // Build Grid
            const grid = document.getElementById('qGrid');
            grid.innerHTML = '';
            questions.forEach((q, index) => {
                const btn = document.createElement('button');
                btn.className = 'q-btn';
                btn.id = `nav-btn-${index}`;
                btn.innerText = q.number;
                btn.onclick = () => goToQuestion(index);
                grid.appendChild(btn);
            });

            goToQuestion(0);
        }

        function getCorrectAnswer(q) {
            if (q.correctAnswer) return q.correctAnswer;
            // Infer from study4 results structure
            const checkedChoice = q.choices.find(c => c.checked);
            if (q.status === 'correct' && checkedChoice) {
                return checkedChoice.value;
            }
            return null; // Might need manual check in explanations for some edge cases
        }

        function goToQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            // Update active state in sidebar
            const oldActive = document.querySelector('.q-btn.active');
            if (oldActive) oldActive.classList.remove('active');
            document.getElementById(`nav-btn-${index}`).classList.add('active');

            currentIndex = index;
            const q = questions[index];
            
            document.getElementById('qPart').innerText = q.part;
            document.getElementById('qNumber').innerText = q.number;

            // Process context HTML
            let contextHtml = q.context || '';
            const parser = new DOMParser();
            const doc = parser.parseFromString(contextHtml, 'text/html');
            
            // Fix study4 media links
            doc.querySelectorAll('img').forEach(img => {
                if (img.dataset.src) img.src = img.dataset.src;
                else if (img.getAttribute('src') && img.getAttribute('src').startsWith('/')) {
                    img.src = 'https://study4.com' + img.getAttribute('src');
                }
            });
            doc.querySelectorAll('source').forEach(src => {
                if (src.getAttribute('src') && src.getAttribute('src').startsWith('/')) {
                    src.src = 'https://study4.com' + src.getAttribute('src');
                }
            });
            
            // Modify collapse elements to work without jQuery/Bootstrap
            doc.querySelectorAll('[data-toggle="collapse"]').forEach(el => {
                el.className = "collapse-toggle";
            });
            doc.querySelectorAll('.collapse').forEach(el => {
                el.className = "collapse-content";
            });

            document.getElementById('qContext').innerHTML = doc.body.innerHTML;

            // Bind click events to the new collapse toggles
            document.getElementById('qContext').querySelectorAll('.collapse-toggle').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    let targetId = el.getAttribute('href');
                    if (targetId && targetId.startsWith('#')) {
                        let target = document.getElementById(targetId.substring(1));
                        if (target) {
                            target.style.display = target.style.display === 'block' ? 'none' : 'block';
                        }
                    }
                });
            });

            // Reload audio
            document.getElementById('qContext').querySelectorAll('audio').forEach(audio => audio.load());

            // Process Choices
            const choicesContainer = document.getElementById('qChoices');
            choicesContainer.innerHTML = '';
            
            const hasCheckedBefore = userAnswers[index] !== undefined;

            q.choices.forEach(c => {
                // If it's a fill in the blank without choices, handle gracefully? 
                // Mostly TOEIC has ABCD
                const label = document.createElement('label');
                label.className = 'choice-label';
                label.id = `choice-lbl-${index}-${c.value}`;
                
                const input = document.createElement('input');
                input.type = 'radio';
                input.name = `q-${q.qid}`;
                input.value = c.value;
                
                if (hasCheckedBefore && userAnswers[index].selected === c.value) {
                    input.checked = true;
                }

                label.appendChild(input);
                label.appendChild(document.createTextNode(c.label || c.value));
                choicesContainer.appendChild(label);
            });

            // Reset or show explanation
            const expDiv = document.getElementById('qExplanation');
            if (hasCheckedBefore) {
                showFeedback(index);
                expDiv.style.display = 'block';
                document.getElementById('explanationContent').innerHTML = q.explanation || 'Không có giải thích.';
                document.getElementById('checkBtn').disabled = true;
            } else {
                expDiv.style.display = 'none';
                document.getElementById('checkBtn').disabled = false;
            }
        }

        function checkAnswer() {
            const q = questions[currentIndex];
            const selected = document.querySelector(`input[name="q-${q.qid}"]:checked`);
            
            if (!selected) {
                alert("Vui lòng chọn một đáp án!");
                return;
            }

            const selectedValue = selected.value;
            let correctValue = getCorrectAnswer(q);

            // Save user answer
            const isCorrect = (selectedValue === correctValue);
            userAnswers[currentIndex] = {
                selected: selectedValue,
                isCorrect: isCorrect,
                correct: correctValue
            };

            showFeedback(currentIndex);
            
            // Show Explanation
            const expDiv = document.getElementById('qExplanation');
            expDiv.style.display = 'block';
            document.getElementById('explanationContent').innerHTML = q.explanation || 'Không có giải thích.';
            
            // Disable check button
            document.getElementById('checkBtn').disabled = true;
        }

        function showFeedback(index) {
            const answerData = userAnswers[index];
            if (!answerData) return;

            // Update sidebar button color
            const navBtn = document.getElementById(`nav-btn-${index}`);
            navBtn.classList.remove('correct', 'wrong');
            navBtn.classList.add(answerData.isCorrect ? 'correct' : 'wrong');

            // Update choices UI
            const correctValue = answerData.correct;
            const selectedValue = answerData.selected;

            const labels = document.getElementById('qChoices').querySelectorAll('.choice-label');
            labels.forEach(label => {
                label.classList.remove('correct', 'wrong');
                const input = label.querySelector('input');
                input.disabled = true; // Disable changes after checking
                
                if (input.value === correctValue) {
                    label.classList.add('correct');
                } else if (input.value === selectedValue && !answerData.isCorrect) {
                    label.classList.add('wrong');
                }
            });
        }

        function nextQuestion() {
            goToQuestion(currentIndex + 1);
        }

        function prevQuestion() {
            goToQuestion(currentIndex - 1);
        }
    </script>
</body>
</html>
